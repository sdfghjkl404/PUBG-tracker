<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Tracker - Start</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f97316;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #f97316;
            background: rgba(255, 255, 255, 0.12);
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .range-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        input[type="range"] {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            padding: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: #f97316;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #f97316;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }
        .range-value {
            font-size: 18px;
            font-weight: 700;
            color: #f97316;
            min-width: 40px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #f97316;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loader.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #fca5a5;
            display: none;
        }
        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PUBG Tracker</h1>
        <p class="subtitle">Анализ матчей и статистики</p>

        <form id="startForm">
            <div class="form-group">
                <label>Никнейм игрока</label>
                <input type="text" id="nickname" placeholder="Введите ник" required>
            </div>

            <div class="form-group">
                <label>Платформа</label>
                <select id="platform">
                    <option value="steam">Steam</option>
                    <option value="kakao">Kakao</option>
                    <option value="psn">PlayStation</option>
                    <option value="xbox">Xbox</option>
                    <option value="stadia">Stadia</option>
                </select>
            </div>

            <div class="form-group">
                <label>Количество матчей</label>
                <div class="range-container">
                    <input type="range" id="matchCount" min="1" max="20" value="5">
                    <span class="range-value" id="matchValue">5</span>
                </div>
            </div>

            <button type="submit">Загрузить матчи</button>
        </form>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Загрузка данных...</div>
        </div>

        <div class="error" id="error"></div>
    </div>

    <script>
        const rangeInput = document.getElementById('matchCount');
        const rangeValue = document.getElementById('matchValue');
        const form = document.getElementById('startForm');
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('error');

        rangeInput.addEventListener('input', (e) => {
            rangeValue.textContent = e.target.value;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nickname = document.getElementById('nickname').value.trim();
            const platform = document.getElementById('platform').value;
            const count = document.getElementById('matchCount').value;

            if (!nickname) {
                showError('Введите никнейм игрока');
                return;
            }

            loader.classList.add('active');
            errorBox.classList.remove('active');
            form.querySelector('button').disabled = true;

            try {
                const response = await fetch('/start_analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, platform, count: parseInt(count) })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/';
                } else {
                    showError(result.error || 'Ошибка загрузки данных');
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
            } finally {
                loader.classList.remove('active');
                form.querySelector('button').disabled = false;
            }
        });

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('active');
        }
    </script>
</body>
</html>
